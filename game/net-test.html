<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Net Test</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #666; --line: #ccc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --line: #444; } }
  body { margin: 0; padding: 12px 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; align-items: center; }
  input[type=text] { width: 110px; padding: 4px; }
  button { padding: 5px 10px; }
  pre { border: 1px solid var(--line); padding: 8px; white-space: pre-wrap; word-break: break-all; margin: 6px 0; max-height: 40vh; overflow: auto; }
  small { color: var(--muted); }
</style>
</head>
<body>
<h3>災厄前線 net test <small>(game/src/net, build: node tools/build-net-test.mjs)</small></h3>
<div class="row">
  名字 <input id="name" type="text"> 版本 <input id="ver" type="text" value="dev">
  <label><input id="relay" type="checkbox"> 強制中繼</label>
</div>
<div class="row">
  <button id="host">建立房間</button>
  代碼 <input id="code" type="text" inputmode="numeric"> <button id="join">加入</button>
  <button id="list">公開房間</button> <button id="leave">離開</button>
</div>
<div class="row"><input id="msg" type="text" value="hello"> <button id="say">送出</button></div>
<pre id="rooms"></pre>
<pre id="peers"></pre>
<pre id="log"></pre>
<script src="net-test.js"></script>
</body>
</html>
